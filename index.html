<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Painel de clientes com busca e distribuição por cidade." />
  <title>Painel de Clientes</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Painel de Clientes</h1>
      <p>Consulte e filtre os clientes cadastrados.</p>
    </header>

    <main class="app-content">
      <div class="search-container">
        <input id="searchInput" class="search-input" type="search" placeholder="Buscar clientes pelo nome..." autocomplete="off" />
      </div>

      <section class="chart-container" aria-label="Distribuição de clientes por cidade">
        <h2>Distribuição de Clientes por Cidade</h2>
        <div class="chart-wrap"><canvas id="cityChart"></canvas></div>
      </section>

      <section id="clientGrid" class="client-grid" aria-live="polite"></section>
    </main>
  </div>

  <div id="status" class="status-message">Carregando dados dos clientes...</div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
